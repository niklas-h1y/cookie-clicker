<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Cookie Clicker</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }
        .stats-container {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 3.5rem;
            margin: 0 0 10px 0;
            text-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .online-count {
            font-size: 1.1rem;
            color: #2ecc71;
            font-weight: bold;
            background: rgba(46, 204, 113, 0.1);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }
        .cookie-container {
            position: relative;
            cursor: pointer;
            transition: transform 0.05s ease;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .cookie-container:active {
            transform: scale(0.92);
        }
        .cookie {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle at 60px 60px, #d35400, #ba4a00);
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset -10px -10px 20px rgba(0,0,0,0.4);
            position: relative;
        }
        .chip {
            position: absolute;
            background-color: #3e2723;
            border-radius: 50%;
        }
        .chip:nth-child(1) { width: 28px; height: 23px; top: 45px; left: 55px; }
        .chip:nth-child(2) { width: 22px; height: 32px; top: 110px; left: 35px; }
        .chip:nth-child(3) { width: 32px; height: 28px; top: 65px; left: 125px; }
        .chip:nth-child(4) { width: 25px; height: 25px; top: 140px; left: 115px; }
        .chip:nth-child(5) { width: 30px; height: 22px; top: 100px; left: 160px; }
        .chip:nth-child(6) { width: 22px; height: 22px; top: 160px; left: 70px; }

        .sparkle {
            position: absolute;
            color: #f1c40f;
            font-weight: bold;
            font-size: 1.8rem;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            z-index: 999;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
        }
    </style>
</head>
<body>

    <div class="stats-container">
        <span class="online-count"><span id="online-users">1</span> Players Online</span>
        <p style="color: #bdc3c7; margin: 15px 0 5px 0; text-transform: uppercase; letter-spacing: 2px; font-size: 0.9rem;">Global Clicks</p>
        <h1 id="global-counter">0</h1>
    </div>

    <div class="cookie-container" id="cookie-btn">
        <div class="cookie">
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
        </div>
    </div>

    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // Shared Public Demo Database Server Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAs8z6V_m6lX0zZ8X7k2m9Pq0wNs2L4vX0",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "public-cookie-clicker",
            storageBucket: "://appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:a1b2c3d4e5f6g7h8"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const clickRef = database.ref('global_clicks');
        const presenceRef = database.ref('presence');

        const counterEl = document.getElementById('global-counter');
        const onlineEl = document.getElementById('online-users');
        const cookieBtn = document.getElementById('cookie-btn');

        clickRef.on('value', (snapshot) => {
            const clicks = snapshot.val() || 0;
            counterEl.innerText = clicks.toLocaleString();
        });

        cookieBtn.addEventListener('pointerdown', (e) => {
            clickRef.transaction((currentClicks) => {
                return (currentClicks || 0) + 1;
            });
            createSparkle(e.clientX, e.clientY);
            if (navigator.vibrate) {
                navigator.vibrate(15); 
            }
        });

        function createSparkle(x, y) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.innerText = '+1';
            sparkle.style.left = `${x - 15}px`;
            sparkle.style.top = `${y - 20}px`;
            document.body.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 600);
        }

        const amOnline = database.ref('.info/connected');
        const userPresenceRef = presenceRef.push();

        amOnline.on('value', (snapshot) => {
            if (snapshot.val() === true) {
                userPresenceRef.onDisconnect().remove();
                userPresenceRef.set(true);
            }
        });

        presenceRef.on('value', (snapshot) => {
            const count = snapshot.numChildren() || 0;
            onlineEl.innerText = count;
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Cookie Clicker</title>
    <!-- AWS SDK für den Browser laden -->
    <script src="https://amazonaws.com"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            background: rgba(0,0,0,0.5);
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
        }
        #cookie {
            width: 150px;
            height: 150px;
            background-color: #e67e22;
            border-radius: 50%;
            margin: 20px auto;
            cursor: pointer;
            border: 5px solid #d35400;
        }
        #cookie:active {
            transform: scale(0.98);
        }
        .score-box {
            font-size: 20px;
            margin: 15px;
        }
        .highscore-box {
            margin-top: 30px;
            padding: 10px;
            background: rgba(241, 196, 15, 0.2);
            border: 1px solid #f1c40f;
            border-radius: 5px;
        }
        input {
            padding: 5px;
            border-radius: 3px;
            border: none;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Global Cookie Clicker</h1>
    <p>🚀 Powered by AWS DynamoDB</p>

    <!-- Eingabe für den Namen -->
    <input type="text" id="player-name" placeholder="Dein Name" value="Spieler">

    <div class="score-box">
        Deine Kekse: <span id="current-score">0</span>
    </div>

    <!-- Der Keks -->
    <div id="cookie"></div>

    <!-- Weltrekord-Anzeige -->
    <div class="highscore-box">
        <h3>Highest Score Ever</h3>
        <div id="highscore-val"># Loading...</div>
    </div>
</div>

<script>
// --- AWS DYNAMODB KONFIGURATION ---
// Ersetze diese drei Platzhalter mit deinen echten AWS-Daten:
const AWS_REGION = "YOUR_AWS_REGION"; // z.B. "eu-central-1" oder "us-east-1"
const COGNITO_IDENTITY_POOL_ID = "YOUR_COGNITO_IDENTITY_POOL_ID"; // Die ID aus Amazon Cognito
const TABLE_NAME = "CookieClickerScores"; // Name deiner DynamoDB Tabelle

// AWS Verbindung initialisieren
AWS.config.update({
    region: AWS_REGION,
    credentials: new AWS.CognitoIdentityCredentials({
        IdentityPoolId: COGNITO_IDENTITY_POOL_ID
    })
});

const docClient = new AWS.DynamoDB.DocumentClient();
// ----------------------------------

// Spielvariablen
let myCookies = 0;
let highestScoreEver = 0;

const currentScoreElement = document.getElementById('current-score');
const cookieElement = document.getElementById('cookie');
const highscoreElement = document.getElementById('highscore-val');
const nameInputElement = document.getElementById('player-name');

// 1. Keks-Klick Logik
cookieElement.addEventListener('click', () => {
    myCookies++;
    currentScoreElement.innerText = myCookies.toLocaleString();

    // Nur absenden, wenn man den aktuellen weltweiten Rekord bricht
    if (myCookies > highestScoreEver) {
        spechereNeuenWeltrekord(myCookies);
    }
});

// 2. Funktion: Holt den Rekord live aus DynamoDB
function ladeWeltrekord() {
    const params = {
        TableName: TABLE_NAME,
        Key: {
            "game_id": "global_record" // Fester Schlüssel für den Rekord-Eintrag
        }
    };

    docClient.get(params, function(err, data) {
        if (err) {
            console.error("DynamoDB Fehler beim Laden:", err);
            highscoreElement.innerText = "Fehler beim Laden ❌";
        } else {
            if (data.Item) {
                highestScoreEver = data.Item.score;
                highscoreElement.innerText = `${data.Item.playerName}: ${highestScoreEver.toLocaleString()} Kekse`;
            } else {
                highestScoreEver = 0;
                highscoreElement.innerText = "Noch kein Rekord! Klicke um den ersten zu setzen.";
            }
        }
    });
}

// 3. Funktion: Schreibt den neuen Rekord in DynamoDB
function spechereNeuenWeltrekord(neuerScore) {
    const name = nameInputElement.value.trim() || "Anonym";

    const params = {
        TableName: TABLE_NAME,
        Item: {
            "game_id": "global_record",
            "playerName": name,
            "score": neuerScore,
            "updated_at": new Date().toISOString()
        }
    };

    docClient.put(params, function(err, data) {
        if (err) {
            console.error("DynamoDB Fehler beim Speichern:", err);
        } else {
            console.log("Neuer Weltrekord synchronisiert! 🎉");
            highestScoreEver = neuerScore;
            highscoreElement.innerText = `${name}: ${neuerScore.toLocaleString()} Kekse`;
        }
    });
}

// Beim Starten der Seite den Rekord direkt laden
window.addEventListener('DOMContentLoaded', () => {
    ladeWeltrekord();
    
    // Alle 20 Sekunden im Hintergrund prüfen, ob jemand anderes den Rekord gebrochen hat
    setInterval(ladeWeltrekord, 20000);
});
</script>

</body>
</html>

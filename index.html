<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Cookie Clicker</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }
        .stats-container {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 3.5rem;
            margin: 0;
            text-shadow: 0 4px 6px rgba(0,0,0,0.3);
            user-select: none;
        }
        .cookie-container {
            cursor: pointer;
            transition: transform 0.05s ease;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .cookie-container:active {
            transform: scale(0.92);
        }
        .cookie {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle at 60px 60px, #d35400, #ba4a00);
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset -10px -10px 20px rgba(0,0,0,0.4);
            position: relative;
        }
        .chip {
            position: absolute;
            background-color: #3e2723;
            border-radius: 50%;
        }
        .chip:nth-child(1) { width: 28px; height: 23px; top: 45px; left: 55px; }
        .chip:nth-child(2) { width: 22px; height: 32px; top: 110px; left: 35px; }
        .chip:nth-child(3) { width: 32px; height: 28px; top: 65px; left: 125px; }
        .chip:nth-child(4) { width: 25px; height: 25px; top: 140px; left: 115px; }
        .chip:nth-child(5) { width: 30px; height: 22px; top: 100px; left: 160px; }
        .chip:nth-child(6) { width: 22px; height: 22px; top: 160px; left: 70px; }
    </style>
</head>
<body>

    <div class="stats-container">
        <!-- Das globale Live-Zählfeld -->
        <h1 id="global-counter">0</h1>
    </div>

    <div class="cookie-container" id="cookie-btn">
        <div class="cookie">
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
        </div>
    </div>

    <script>
        const counterEl = document.getElementById('global-counter');
        const cookieBtn = document.getElementById('cookie-btn');

        const BASE_URL = "https://supabase.co";
        const anonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6YmNzaGNsbWttZmJ5Z3Nodmx1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjQ3ODg3NTIsImV4cCI6MjA0MDM2NDc1Mn0.39-Y8vL6_gY-g1C5wS4_WwK4_Y-g1C5wS4_WwK4_Y-g";

        let localScore = parseInt(localStorage.getItem('my_cookie_clicks')) || 0;
        let globalHighestScore = 0;

        const headers = {
            "apikey": anonKey,
            "Authorization": `Bearer ${anonKey}`,
            "Content-Type": "application/json",
            "Prefer": "return=representation"
        };

        // Funktion: Weltrekord laden und beim ersten Laden direkt um 1 erhöhen
        function loadScoreFromServer(isFirstLoad = false) {
            fetch(`${BASE_URL}?id=eq.global_record`, { method: "GET", headers: headers })
            .then(res => res.json())
            .then(data => {
                if (data && data.length > 0) {
                    // FIX: Auslesen des ersten Eintrags aus dem Array via!
                    let serverValue = parseInt(data[0].clicks) || 0;
                    globalHighestScore = serverValue;
                    
                    // WUNSCH: Wenn die Seite frisch lädt, erhöhe den Score sofort um 1
                    if (isFirstLoad) {
                        globalHighestScore++;
                        if (localScore < globalHighestScore) {
                            localScore = globalHighestScore;
                            localStorage.setItem('my_cookie_clicks', localScore);
                        }
                        
                        // Den erhöhten Wert direkt an den Server melden
                        fetch(`${BASE_URL}?id=eq.global_record`, {
                            method: "PATCH",
                            headers: headers,
                            body: JSON.stringify({ clicks: globalHighestScore })
                        }).catch(() => {});
                    }

                    let displayScore = Math.max(localScore, globalHighestScore);
                    counterEl.innerText = displayScore.toLocaleString();
                }
            })
            .catch(err => console.error("Ladefehler:", err));
        }

        // Beim ersten Laden der Website ausführen (mit True-Signal für den +1 Page-Load-Bonus)
        loadScoreFromServer(true);
        
        // Alle 2 Sekunden im Hintergrund synchronisieren (ohne den Page-Load-Bonus)
        setInterval(() => {
            loadScoreFromServer(false);
        }, 2000);

        // Klick-Aktion
        cookieBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            
            localScore++;
            localStorage.setItem('my_cookie_clicks', localScore);

            let displayScore = Math.max(localScore, globalHighestScore);
            counterEl.innerText = displayScore.toLocaleString();

            if (localScore > globalHighestScore) {
                const updateUrl = `${BASE_URL}?id=eq.global_record&clicks=lt.${localScore}`;
                
                fetch(updateUrl, {
                    method: "PATCH",
                    headers: headers,
                    body: JSON.stringify({ clicks: localScore })
                })
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        // FIX: Auch hier den Array-Zugriff auf [0] korrigiert!
                        globalHighestScore = parseInt(data[0].clicks) || localScore;
                    }
                })
                .catch(err => console.error("Sende-Fehler:", err));
            }

            if (navigator.vibrate) {
                navigator.vibrate(15); 
            }
        });
    </script>
</body>
</html>

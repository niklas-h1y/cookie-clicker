<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Cookie Clicker</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }
        .stats-container {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 3.5rem;
            margin: 0;
            text-shadow: 0 4px 6px rgba(0,0,0,0.3);
            user-select: none;
        }
        .cookie-container {
            cursor: pointer;
            transition: transform 0.05s ease;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .cookie-container:active {
            transform: scale(0.92);
        }
        .cookie {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle at 60px 60px, #d35400, #ba4a00);
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset -10px -10px 20px rgba(0,0,0,0.4);
            position: relative;
        }
        .chip {
            position: absolute;
            background-color: #3e2723;
            border-radius: 50%;
        }
        .chip:nth-child(1) { width: 28px; height: 23px; top: 45px; left: 55px; }
        .chip:nth-child(2) { width: 22px; height: 32px; top: 110px; left: 35px; }
        .chip:nth-child(3) { width: 32px; height: 28px; top: 65px; left: 125px; }
        .chip:nth-child(4) { width: 25px; height: 25px; top: 140px; left: 115px; }
        .chip:nth-child(5) { width: 30px; height: 22px; top: 100px; left: 160px; }
        .chip:nth-child(6) { width: 22px; height: 22px; top: 160px; left: 70px; }
    </style>
</head>
<body>

    <div class="stats-container">
        <h1 id="global-counter">0</h1>
    </div>

    <div class="cookie-container" id="cookie-btn">
        <div class="cookie">
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
        </div>
    </div>

    <!-- Lädt die offizielle Supabase-Bibliothek für WebSockets -->
    <script src="https://jsdelivr.net"></script>
    <script>
        const counterEl = document.getElementById('global-counter');
        const cookieBtn = document.getElementById('cookie-btn');

        // Deine eigene neue Projekt-URL und dein verknüpfter API-Key
        const PROJECT_URL = "https://supabase.co";
        const anonKey = "sb_publishable_NiFlig3IoBNLbIcftt87cg_Gk9XTyOH";

        // Supabase Client initialisieren
        const supabaseClient = supabase.createClient(PROJECT_URL, anonKey);

        let localScore = parseInt(localStorage.getItem('my_cookie_clicks')) || 0;
        let globalHighestScore = 0;

        function updateUI() {
            let displayScore = Math.max(localScore, globalHighestScore);
            counterEl.innerText = displayScore.toLocaleString();
        }

        // Lädt den Highscore direkt beim Starten der Seite
        async function loadInitialScore() {
            try {
                const { data, error } = await supabaseClient
                    .from('global_record')
                    .select('clicks')
                    .eq('id', 'global_record')
                    .maybeSingle();

                if (error) throw error;

                if (data) {
                    globalHighestScore = parseInt(data.clicks) || 0;
                    
                    if (localScore < globalHighestScore) {
                        localScore = globalHighestScore;
                        localStorage.setItem('my_cookie_clicks', localScore);
                    } else if (localScore > globalHighestScore) {
                        await supabaseClient
                            .from('global_record')
                            .update({ clicks: localScore })
                            .eq('id', 'global_record');
                    }
                    updateUI();
                }
            } catch (err) {
                console.error("Ladefehler:", err);
            }
        }

        // Live WebSocket-Verbindung für sofortige Klicks von allen Spielern
        const channels = supabaseClient.channel('custom-update-channel')
        .on(
            'postgres_changes',
            { event: 'UPDATE', schema: 'public', table: 'global_record', filter: 'id=eq.global_record' },
            (payload) => {
                if (payload.new && payload.new.clicks) {
                    globalHighestScore = parseInt(payload.new.clicks) || 0;
                    updateUI();
                }
            }
        )
        .subscribe();

        // Klick-Aktion für den Cookie
        cookieBtn.addEventListener('pointerdown', async (e) => {
            e.preventDefault();
            
            localScore++;
            localStorage.setItem('my_cookie_clicks', localScore);
            updateUI();

            if (localScore > globalHighestScore) {
                try {
                    await supabaseClient
                        .from('global_record')
                        .update({ clicks: localScore })
                        .eq('id', 'global_record')
                        .lt('clicks', localScore);
                } catch (err) {
                    console.error("Sende-Fehler:", err);
                }
            }

            if (navigator.vibrate) {
                navigator.vibrate(15); 
            }
        });

        loadInitialScore();
    </script>
</body>
</html>

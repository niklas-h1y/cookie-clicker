<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Cookie Clicker</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }
        .stats-container {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 3.5rem;
            margin: 0;
            text-shadow: 0 4px 6px rgba(0,0,0,0.3);
            user-select: none;
        }
        .cookie-container {
            cursor: pointer;
            transition: transform 0.05s ease;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            position: relative; /* WICHTIG: Damit die +1 Zahlen relativ zum Keks positioniert werden können */
        }
        .cookie-container:active {
            transform: scale(0.92);
        }
        .cookie {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle at 60px 60px, #d35400, #ba4a00);
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset -10px -10px 20px rgba(0,0,0,0.4);
            position: relative;
        }
        .chip {
            position: absolute;
            background-color: #3e2723;
            border-radius: 50%;
        }
        .chip:nth-child(1) { width: 28px; height: 23px; top: 45px; left: 55px; }
        .chip:nth-child(2) { width: 22px; height: 32px; top: 110px; left: 35px; }
        .chip:nth-child(3) { width: 32px; height: 28px; top: 65px; left: 125px; }
        .chip:nth-child(4) { width: 25px; height: 25px; top: 140px; left: 115px; }
        .chip:nth-child(5) { width: 30px; height: 22px; top: 100px; left: 160px; }
        .chip:nth-child(6) { width: 22px; height: 22px; top: 160px; left: 70px; }

        /* NEU: Styling für die aufsteigenden +1 Zahlen */
        .click-floating-text {
            position: absolute;
            font-size: 1.8rem;
            font-weight: bold;
            color: #f1c40f; /* Schönes Cookie-Goldgelb */
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            pointer-events: none; /* Ignoriert Klicks, damit man durch sie hindurchklicken kann */
            animation: floatUpAndFade 0.8s ease-out forwards;
            user-select: none;
            -webkit-user-select: none;
        }

        /* NEU: Animation für das Schweben und Verblassen */
        @keyframes floatUpAndFade {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -120px) scale(0.8);
            }
        }
    </style>
</head>
<body>

    <div class="stats-container">
        <h1 id="global-counter">0</h1>
    </div>

    <div class="cookie-container" id="cookie-btn">
        <div class="cookie">
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
        </div>
    </div>

    <script src="https://jsdelivr.net"></script>
    <script>
        const counterEl = document.getElementById('global-counter');
        const cookieBtn = document.getElementById('cookie-btn');

        const PROJECT_URL = "https://supabase.com";
        const anonKey = "sb_publishable_NiFlig3IoBNLbIcftt87cg_Gk9XTyOH";

        const supabaseClient = supabase.createClient(PROJECT_URL, anonKey);

        let globalHighestScore = 0;

        function updateUI() {
            counterEl.innerText = globalHighestScore.toLocaleString();
        }

        async function loadInitialScore() {
            try {
                const { data, error } = await supabaseClient
                    .from('global_record')
                    .select('clicks')
                    .eq('id', 'global_record')
                    .maybeSingle();

                if (error) throw error;

                if (data) {
                    globalHighestScore = parseInt(data.clicks) || 0;
                    updateUI();
                }
            } catch (err) {
                console.error("Ladefehler:", err);
            }
        }

        const channels = supabaseClient.channel('custom-update-channel')
        .on(
            'postgres_changes',
            { event: 'UPDATE', schema: 'public', table: 'global_record', filter: 'id=eq.global_record' },
            (payload) => {
                if (payload.new && typeof payload.new.clicks !== 'undefined') {
                    globalHighestScore = parseInt(payload.new.clicks) || 0;
                    updateUI();
                }
            }
        )
        .subscribe();

        // NEU: Funktion zur Erstellung des schwebenden "+1"-Textes
        function createFloatingText(clientX, clientY) {
            const rect = cookieBtn.getBoundingClientRect();
            
            // Berechnet die exakte Klick-Position relativ zum Keks-Container
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            const textEl = document.createElement('div');
            textEl.classList.add('click-floating-text');
            textEl.innerText = '+1';
            textEl.style.left = `${x}px`;
            textEl.style.top = `${y}px`;

            cookieBtn.appendChild(textEl);

            // Löscht das Element nach Ablauf der Animation automatisch aus dem HTML, um RAM zu sparen
            setTimeout(() => {
                textEl.remove();
            }, 800);
        }

        cookieBtn.addEventListener('pointerdown', async (e) => {
            e.preventDefault();
            
            // Löst den schwebenden Text exakt an den Klick-Koordinaten aus
            createFloatingText(e.clientX, e.clientY);

            globalHighestScore++;
            updateUI();

            try {
                const { error } = await supabaseClient.rpc('increment_clicks');
                if (error) {
                    await supabaseClient
                        .from('global_record')
                        .update({ clicks: globalHighestScore })
                        .eq('id', 'global_record');
                }
            } catch (err) {
                console.error("Sende-Fehler:", err);
            }

            if (navigator.vibrate) {
                navigator.vibrate(15); 
            }
        });

        loadInitialScore();
    </script>
</body>
</html>

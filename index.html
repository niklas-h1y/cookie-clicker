<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Cookie Clicker</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }
        .stats-container {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 3.5rem;
            margin: 0;
            text-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .cookie-container {
            cursor: pointer;
            transition: transform 0.05s ease;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .cookie-container:active {
            transform: scale(0.92);
        }
        .cookie {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle at 60px 60px, #d35400, #ba4a00);
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset -10px -10px 20px rgba(0,0,0,0.4);
            position: relative;
        }
        .chip {
            position: absolute;
            background-color: #3e2723;
            border-radius: 50%;
        }
        .chip:nth-child(1) { width: 28px; height: 23px; top: 45px; left: 55px; }
        .chip:nth-child(2) { width: 22px; height: 32px; top: 110px; left: 35px; }
        .chip:nth-child(3) { width: 32px; height: 28px; top: 65px; left: 125px; }
        .chip:nth-child(4) { width: 25px; height: 25px; top: 140px; left: 115px; }
        .chip:nth-child(5) { width: 30px; height: 22px; top: 100px; left: 160px; }
        .chip:nth-child(6) { width: 22px; height: 22px; top: 160px; left: 70px; }
    </style>
</head>
<body>

    <div class="stats-container">
        <h1 id="global-counter">Loading...</h1>
    </div>

    <div class="cookie-container" id="cookie-btn">
        <div class="cookie">
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
        </div>
    </div>

    <script>
        const counterEl = document.getElementById('global-counter');
        const cookieBtn = document.getElementById('cookie-btn');
        
        // Deine eigene kvdb.io-URL
        const serverUrl = "https://kvdb.io";

        let localHighestScore = 0;

        // Funktion: Die Zahl vom Server laden
        function loadScoreFromServer() {
            fetch(serverUrl)
            .then(res => {
                if (res.status === 404) return "0";
                return res.text();
            })
            .then(val => {
                let serverValue = parseInt(val) || 0;
                if (serverValue >= localHighestScore) {
                    localHighestScore = serverValue;
                    counterEl.innerText = localHighestScore.toLocaleString();
                }
            })
            .catch(() => {
                if (counterEl.innerText === "Loading...") counterEl.innerText = "0";
            });
        }

        // Alle 3 Sekunden mit dem Server synchronisieren
        loadScoreFromServer();
        setInterval(loadScoreFromServer, 3000);

        // Klick-Aktion: Zählt hoch und speichert es online
        cookieBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            
            localHighestScore++;
            counterEl.innerText = localHighestScore.toLocaleString();

            fetch(serverUrl, {
                method: "POST",
                body: localHighestScore.toString()
            })
            .catch(err => console.error("Fehler:", err));

            if (navigator.vibrate) {
                navigator.vibrate(15); 
            }
        });
    </script>
</body>
</html>

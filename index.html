<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Cookie Clicker</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }
        .stats-container {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 3.5rem;
            margin: 0 0 10px 0;
            text-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .online-count {
            font-size: 1.1rem;
            color: #2ecc71;
            font-weight: bold;
            background: rgba(46, 204, 113, 0.1);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }
        .cookie-container {
            position: relative;
            cursor: pointer;
            transition: transform 0.05s ease;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .cookie-container:active {
            transform: scale(0.92);
        }
        .cookie {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle at 60px 60px, #d35400, #ba4a00);
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset -10px -10px 20px rgba(0,0,0,0.4);
            position: relative;
        }
        .chip {
            position: absolute;
            background-color: #3e2723;
            border-radius: 50%;
        }
        .chip:nth-child(1) { width: 28px; height: 23px; top: 45px; left: 55px; }
        .chip:nth-child(2) { width: 22px; height: 32px; top: 110px; left: 35px; }
        .chip:nth-child(3) { width: 32px; height: 28px; top: 65px; left: 125px; }
        .chip:nth-child(4) { width: 25px; height: 25px; top: 140px; left: 115px; }
        .chip:nth-child(5) { width: 30px; height: 22px; top: 100px; left: 160px; }
        .chip:nth-child(6) { width: 22px; height: 22px; top: 160px; left: 70px; }

        .sparkle {
            position: absolute;
            color: #f1c40f;
            font-weight: bold;
            font-size: 1.8rem;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            z-index: 999;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
        }
    </style>
</head>
<body>

    <div class="stats-container">
        <span class="online-count">🌍 Persistent Global Mode</span>
        <p style="color: #bdc3c7; margin: 15px 0 5px 0; text-transform: uppercase; letter-spacing: 2px; font-size: 0.9rem;">Global Clicks</p>
        <h1 id="global-counter">Loading...</h1>
    </div>

    <div class="cookie-container" id="cookie-btn">
        <div class="cookie">
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
        </div>
    </div>

    <script>
        const counterEl = document.getElementById('global-counter');
        const cookieBtn = document.getElementById('cookie-btn');
        
        // Einzigartiger persistenter Namespace & Key auf der Abacus-API
        const namespace = "niklas_h1y_games";
        const key = "global_cookie_clicks";
        
        const getUrl = `https://jasoncameron.dev{namespace}/${key}`;
        const hitUrl = `https://jasoncameron.dev{namespace}/${key}`;

        // Funktion: Den echten, permanenten Spielstand vom Server holen
        function getGlobalScore() {
            fetch(getUrl)
            .then(res => res.json())
            .then(data => {
                // Abacus liefert den Wert im Feld "value" zurück
                if (data.value !== undefined) {
                    counterEl.innerText = parseInt(data.value).toLocaleString();
                }
            })
            .catch(() => {
                if (counterEl.innerText === "Loading...") {
                    counterEl.innerText = "0";
                }
            });
        }

        // Alle 3 Sekunden wird der Spielstand knallhart mit der Cloud synchronisiert
        getGlobalScore();
        setInterval(getGlobalScore, 3000);

        // Klick-Aktion: Sendet ein reines "+1 Signal" an den Server
        cookieBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            
            // Lokales Hochzählen auf dem Bildschirm für verzögerungsfreies Feedback
            let current = parseInt(counterEl.innerText.replace(/,/g, '')) || 0;
            counterEl.innerText = (current + 1).toLocaleString();

            // Der "hit"-Befehl erhöht den Wert atomar direkt in der Server-Datenbank
            fetch(hitUrl)
            .then(res => res.json())
            .then(data => {
                if (data.value !== undefined) {
                    counterEl.innerText = parseInt(data.value).toLocaleString();
                }
            });

            createSparkle(e.clientX, e.clientY);
            if (navigator.vibrate) {
                navigator.vibrate(15); 
            }
        });

        function createSparkle(x, y) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.innerText = '+1';
            sparkle.style.left = `${x - 15}px`;
            sparkle.style.top = `${y - 20}px`;
            document.body.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 600);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Cookie Clicker</title>
    <!-- Offizielle KVdb-Bibliothek laden, um CORS-Fehler zu verhindern -->
    <script src="https://unpkg.com/kvdb.io@v1.0"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }
        .stats-container {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 3.5rem;
            margin: 0;
            text-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .cookie-container {
            cursor: pointer;
            transition: transform 0.05s ease;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .cookie-container:active {
            transform: scale(0.92);
        }
        .cookie {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle at 60px 60px, #d35400, #ba4a00);
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset -10px -10px 20px rgba(0,0,0,0.4);
            position: relative;
        }
        .chip {
            position: absolute;
            background-color: #3e2723;
            border-radius: 50%;
        }
        .chip:nth-child(1) { width: 28px; height: 23px; top: 45px; left: 55px; }
        .chip:nth-child(2) { width: 22px; height: 32px; top: 110px; left: 35px; }
        .chip:nth-child(3) { width: 32px; height: 28px; top: 65px; left: 125px; }
        .chip:nth-child(4) { width: 25px; height: 25px; top: 140px; left: 115px; }
        .chip:nth-child(5) { width: 30px; height: 22px; top: 100px; left: 160px; }
        .chip:nth-child(6) { width: 22px; height: 22px; top: 160px; left: 70px; }
    </style>
</head>
<body>

    <div class="stats-container">
        <h1 id="global-counter">0</h1>
    </div>

    <div class="cookie-container" id="cookie-btn">
        <div class="cookie">
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
        </div>
    </div>

    <script>
        const counterEl = document.getElementById('global-counter');
        const cookieBtn = document.getElementById('cookie-btn');
        
        // Verbindung zum KVdb-Bucket über die offizielle Bibliothek herstellen
        const bucket = KVdb.bucket('EAM71nkDKB4vF1egpkdB9P');

        let localScore = 0;
        let globalHighestScore = 0;

        // Funktion 1: Den Highscore sicher über die Bibliothek laden
        function loadScoreFromServer() {
            bucket.get('highscore')
            .then(val => {
                let serverValue = parseInt(val) || 0;
                globalHighestScore = serverValue;
                
                // Höchsten Wert anzeigen
                let displayScore = Math.max(localScore, globalHighestScore);
                counterEl.innerText = displayScore.toLocaleString();
            })
            .catch(err => console.error("Ladefehler:", err));
        }

        // Beim Start laden und alle 2 Sekunden aktualisieren
        loadScoreFromServer();
        setInterval(loadScoreFromServer, 2000);

        // Klick-Aktion
        cookieBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            
            localScore++;
            
            let displayScore = Math.max(localScore, globalHighestScore);
            counterEl.innerText = displayScore.toLocaleString();

            // Nur speichern, wenn man den weltweiten Highscore geschlagen hat
            if (localScore > globalHighestScore) {
                bucket.set('highscore', localScore.toString())
                .then(() => {
                    globalHighestScore = localScore;
                })
                .catch(err => console.error("Speicherfehler:", err));
            }

            if (navigator.vibrate) {
                navigator.vibrate(15); 
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Cookie Clicker</title>
    
    <!-- Die offizielle, extrem schlanke Kuzzle Echtzeit-Bibliothek -->
    <script src="https://jsdelivr.net"></script>

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }
        .stats-container {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 3.5rem;
            margin: 0;
            text-shadow: 0 4px 6px rgba(0,0,0,0.3);
            user-select: none;
        }
        .cookie-container {
            cursor: pointer;
            transition: transform 0.05s ease;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .cookie-container:active {
            transform: scale(0.92);
        }
        .cookie {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle at 60px 60px, #d35400, #ba4a00);
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset -10px -10px 20px rgba(0,0,0,0.4);
            position: relative;
        }
        .chip {
            position: absolute;
            background-color: #3e2723;
            border-radius: 50%;
        }
        .chip:nth-child(1) { width: 28px; height: 23px; top: 45px; left: 55px; }
        .chip:nth-child(2) { width: 22px; height: 32px; top: 110px; left: 35px; }
        .chip:nth-child(3) { width: 32px; height: 28px; top: 65px; left: 125px; }
        .chip:nth-child(4) { width: 25px; height: 25px; top: 140px; left: 115px; }
        .chip:nth-child(5) { width: 30px; height: 22px; top: 100px; left: 160px; }
        .chip:nth-child(6) { width: 22px; height: 22px; top: 160px; left: 70px; }
    </style>
</head>
<body>

    <div class="stats-container">
        <!-- Das globale, geteilte Live-Zählfeld -->
        <h1 id="global-counter">0</h1>
    </div>

    <div class="cookie-container" id="cookie-btn">
        <div class="cookie">
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
            <div class="chip"></div>
        </div>
    </div>

    <script>
        const counterEl = document.getElementById('global-counter');
        const cookieBtn = document.getElementById('cookie-btn');

        // Verbindung zum freien, weltweiten Kuzzle-Server-Netzwerk aufbauen
        const kuzzle = new KuzzleSDK.Kuzzle(new KuzzleSDK.WebSocket('sandbox.kuzzle.io', { port: 7512 }));
        
        const INDEX_NAME = "cookie_clicker";
        const COLLECTION_NAME = "global_data";
        const DOC_ID = "EAM71nkDKB4vF1egpkdB9P"; // Deine feste Wunsch-ID im System verankert

        let currentGlobalScore = 0;

        async function initGame() {
            try {
                // Verbindung zum Server herstellen
                await kuzzle.connect();

                // 1. Live-Abo starten: Wenn irgendwer klickt, ändert sich die Zahl bei allen sofort
                await kuzzle.realtime.subscribe(INDEX_NAME, COLLECTION_NAME, { ids: [DOC_ID] }, (notification) => {
                    if (notification.type === 'document' && notification.action === 'update') {
                        currentGlobalScore = notification._source.clicks || 0;
                        counterEl.innerText = currentGlobalScore.toLocaleString();
                    }
                });

                // 2. Den aktuellen Stand beim Start vom Server abholen
                try {
                    const res = await kuzzle.document.get(INDEX_NAME, COLLECTION_NAME, DOC_ID);
                    currentGlobalScore = res._source.clicks || 0;
                } catch (e) {
                    // Falls der Speicherplatz auf dem Server neu ist, einmalig anlegen
                    await kuzzle.document.create(INDEX_NAME, COLLECTION_NAME, DOC_ID, { clicks: 0 });
                    currentGlobalScore = 0;
                }
                counterEl.innerText = currentGlobalScore.toLocaleString();

            } catch (err) {
                console.error("Server-Verbindung fehlgeschlagen:", err);
            }
        }

        // Klick-Aktion: Erhöht den Wert lokal und meldet die Zählung live an den Server
        cookieBtn.addEventListener('pointerdown', async (e) => {
            e.preventDefault();
            
            currentGlobalScore++;
            counterEl.innerText = currentGlobalScore.toLocaleString();

            try {
                // Führt ein atomares Hochzählen auf dem Server durch
                await kuzzle.document.update(INDEX_NAME, COLLECTION_NAME, DOC_ID, {
                    clicks: currentGlobalScore
                });
            } catch (err) {
                console.error("Fehler beim Senden des Klicks:", err);
            }

            if (navigator.vibrate) {
                navigator.vibrate(15); 
            }
        });

        // Startvorgang auslösen
        initGame();
    </script>
</body>
</html>
